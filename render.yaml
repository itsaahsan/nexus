services:
  - type: web
    name: nexus-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: LLM_PROVIDER
        value: demo
databases:
  - name: nexus-db
    plan: free
